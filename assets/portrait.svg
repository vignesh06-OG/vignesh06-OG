<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="500" height="650" style="background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);">
  <defs>
    <filter id="particleGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="dotShine" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Ultra-dense dot portrait using particle reconstruction -->
  <g filter="url(#particleGlow)">
    <!-- Top of head / hair area - maximum density -->
    <circle cx="250" cy="120" r="5" fill="#00d4ff" opacity="0.95"/>
    <circle cx="235" cy="110" r="4" fill="#00d4ff" opacity="0.9"/>
    <circle cx="265" cy="110" r="4" fill="#00d4ff" opacity="0.9"/>
    <circle cx="220" cy="115" r="3.5" fill="#0099ff" opacity="0.75"/>
    <circle cx="280" cy="115" r="3.5" fill="#0099ff" opacity="0.75"/>
    <circle cx="250" cy="105" r="4.5" fill="#00d4ff" opacity="0.88"/>
    
    <!-- Upper forehead - high density -->
    <circle cx="210" cy="135" r="3" fill="#00d4ff" opacity="0.8"/>
    <circle cx="250" cy="132" r="3.8" fill="#00d4ff" opacity="0.85"/>
    <circle cx="290" cy="135" r="3" fill="#00d4ff" opacity="0.8"/>
    <circle cx="230" cy="140" r="2.5" fill="#0099ff" opacity="0.65"/>
    <circle cx="270" cy="140" r="2.5" fill="#0099ff" opacity="0.65"/>
    <circle cx="250" cy="138" r="2.2" fill="#0099ff" opacity="0.6"/>
    
    <!-- Forehead to brow -->
    <circle cx="195" cy="150" r="2.8" fill="#0099ff" opacity="0.7"/>
    <circle cx="250" cy="148" r="3.2" fill="#00d4ff" opacity="0.8"/>
    <circle cx="305" cy="150" r="2.8" fill="#0099ff" opacity="0.7"/>
    <circle cx="180" cy="155" r="2" fill="#0066cc" opacity="0.5"/>
    <circle cx="320" cy="155" r="2" fill="#0066cc" opacity="0.5"/>
    
    <!-- Eyes - critical feature, densest particle concentration -->
    <!-- Left eye -->
    <circle cx="190" cy="170" r="4.5" fill="#00d4ff" opacity="0.95"/>
    <circle cx="187" cy="167" r="2.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="192" cy="172" r="1.5" fill="#000000" opacity="0.95"/>
    <circle cx="185" cy="165" r="1.8" fill="#00d4ff" opacity="0.6"/>
    <circle cx="195" cy="175" r="1.2" fill="#ffffff" opacity="0.5"/>
    
    <!-- Right eye -->
    <circle cx="310" cy="170" r="4.5" fill="#00d4ff" opacity="0.95"/>
    <circle cx="313" cy="167" r="2.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="308" cy="172" r="1.5" fill="#000000" opacity="0.95"/>
    <circle cx="315" cy="165" r="1.8" fill="#00d4ff" opacity="0.6"/>
    <circle cx="305" cy="175" r="1.2" fill="#ffffff" opacity="0.5"/>
    
    <!-- Eye surround detail -->
    <circle cx="175" cy="170" r="2.2" fill="#0099ff" opacity="0.55"/>
    <circle cx="205" cy="170" r="2.2" fill="#0099ff" opacity="0.55"/>
    <circle cx="295" cy="170" r="2.2" fill="#0099ff" opacity="0.55"/>
    <circle cx="325" cy="170" r="2.2" fill="#0099ff" opacity="0.55"/>
    <circle cx="185" cy="155" r="1.8" fill="#0066cc" opacity="0.45"/>
    <circle cx="315" cy="155" r="1.8" fill="#0066cc" opacity="0.45"/>
    
    <!-- Nose bridge - vertical line of definition -->
    <circle cx="250" cy="175" r="2.5" fill="#0099ff" opacity="0.75"/>
    <circle cx="250" cy="183" r="2.2" fill="#0099ff" opacity="0.7"/>
    <circle cx="250" cy="191" r="2" fill="#0099ff" opacity="0.65"/>
    <circle cx="250" cy="199" r="2" fill="#0099ff" opacity="0.6"/>
    
    <!-- Nose tip -->
    <circle cx="248" cy="206" r="1.8" fill="#0099ff" opacity="0.55"/>
    <circle cx="252" cy="206" r="1.8" fill="#0099ff" opacity="0.55"/>
    
    <!-- Cheekbone contours - definition and shadow -->
    <circle cx="170" cy="190" r="3" fill="#00d4ff" opacity="0.7"/>
    <circle cx="330" cy="190" r="3" fill="#00d4ff" opacity="0.7"/>
    <circle cx="160" cy="200" r="2.5" fill="#0099ff" opacity="0.6"/>
    <circle cx="340" cy="200" r="2.5" fill="#0099ff" opacity="0.6"/>
    <circle cx="155" cy="215" r="2" fill="#0066cc" opacity="0.45"/>
    <circle cx="345" cy="215" r="2" fill="#0066cc" opacity="0.45"/>
    <circle cx="165" cy="210" r="2.2" fill="#0099ff" opacity="0.55"/>
    <circle cx="335" cy="210" r="2.2" fill="#0099ff" opacity="0.55"/>
    
    <!-- Mid-face definition -->
    <circle cx="215" cy="185" r="2.2" fill="#0099ff" opacity="0.65"/>
    <circle cx="285" cy="185" r="2.2" fill="#0099ff" opacity="0.65"/>
    <circle cx="210" cy="195" r="1.8" fill="#0099ff" opacity="0.55"/>
    <circle cx="290" cy="195" r="1.8" fill="#0099ff" opacity="0.55"/>
    
    <!-- Mouth area -->
    <circle cx="220" cy="225" r="2.2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="250" cy="228" r="2.5" fill="#00d4ff" opacity="0.7"/>
    <circle cx="280" cy="225" r="2.2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="235" cy="232" r="1.8" fill="#0099ff" opacity="0.5"/>
    <circle cx="265" cy="232" r="1.8" fill="#0099ff" opacity="0.5"/>
    <circle cx="250" cy="235" r="1.5" fill="#0099ff" opacity="0.45"/>
    
    <!-- Jawline and chin definition -->
    <circle cx="150" cy="220" r="2" fill="#0099ff" opacity="0.5"/>
    <circle cx="350" cy="220" r="2" fill="#0099ff" opacity="0.5"/>
    <circle cx="140" cy="240" r="1.8" fill="#0099ff" opacity="0.45"/>
    <circle cx="360" cy="240" r="1.8" fill="#0099ff" opacity="0.45"/>
    <circle cx="135" cy="260" r="1.5" fill="#0066cc" opacity="0.35"/>
    <circle cx="365" cy="260" r="1.5" fill="#0066cc" opacity="0.35"/>
    
    <!-- Chin -->
    <circle cx="245" cy="255" r="2.8" fill="#0099ff" opacity="0.65"/>
    <circle cx="250" cy="262" r="2.5" fill="#0099ff" opacity="0.6"/>
    <circle cx="255" cy="255" r="2.8" fill="#0099ff" opacity="0.65"/>
    
    <!-- Neck definition -->
    <circle cx="235" cy="275" r="2.2" fill="#0099ff" opacity="0.55"/>
    <circle cx="250" cy="280" r="2.5" fill="#0099ff" opacity="0.6"/>
    <circle cx="265" cy="275" r="2.2" fill="#0099ff" opacity="0.55"/>
    <circle cx="220" cy="290" r="1.8" fill="#0099ff" opacity="0.45"/>
    <circle cx="280" cy="290" r="1.8" fill="#0099ff" opacity="0.45"/>
    
    <!-- Shoulders silhouette - sparse -->
    <circle cx="200" cy="310" r="1.5" fill="#0066cc" opacity="0.35"/>
    <circle cx="300" cy="310" r="1.5" fill="#0066cc" opacity="0.35"/>
    <circle cx="180" cy="330" r="1.2" fill="#0066cc" opacity="0.25"/>
    <circle cx="320" cy="330" r="1.2" fill="#0066cc" opacity="0.25"/>
    
    <!-- Hair volume detail - sides -->
    <circle cx="175" cy="130" r="2.5" fill="#0099ff" opacity="0.6"/>
    <circle cx="325" cy="130" r="2.5" fill="#0099ff" opacity="0.6"/>
    <circle cx="165" cy="145" r="2" fill="#0099ff" opacity="0.5"/>
    <circle cx="335" cy="145" r="2" fill="#0099ff" opacity="0.5"/>
    <circle cx="160" cy="160" r="1.8" fill="#0066cc" opacity="0.4"/>
    <circle cx="340" cy="160" r="1.8" fill="#0066cc" opacity="0.4"/>
  </g>

  <!-- Subtle ambient particles for depth -->
  <g opacity="0.3">
    <circle cx="120" cy="180" r="1" fill="#00d4ff"/>
    <circle cx="380" cy="180" r="1" fill="#00d4ff"/>
    <circle cx="130" cy="250" r="0.8" fill="#0099ff"/>
    <circle cx="370" cy="250" r="0.8" fill="#0099ff"/>
  </g>

  <!-- Decorative frame -->
  <rect x="30" y="30" width="440" height="570" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.3" rx="8"/>
</svg>