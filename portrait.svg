<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" width="450" height="600" style="background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%); display: block;">
  <!-- Professional Dot Portrait with Particle Effect -->
  <defs>
    <radialGradient id="dotGradient1" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:0.4" />
    </radialGradient>
    <radialGradient id="dotGradient2" cx="40%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:0.2" />
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background gradient -->
  <rect width="450" height="600" fill="url(#bg)"/>
  
  <!-- Title Section -->
  <text x="225" y="50" font-family="'Courier New', monospace" font-size="36" font-weight="bold" fill="#00d9ff" text-anchor="middle" letter-spacing="3">VIGNESH</text>
  <text x="225" y="80" font-family="'Courier New', monospace" font-size="16" fill="#0099cc" text-anchor="middle" letter-spacing="4" opacity="0.85">DEV • ENGINEER</text>
  
  <!-- Decorative line -->
  <line x1="100" y1="95" x2="350" y2="95" stroke="#00d9ff" stroke-width="2" opacity="0.4"/>
  
  <!-- Dot Portrait Head - High density particle portrait -->
  <g filter="url(#softGlow)" opacity="0.95">
    
    <!-- Top Head/Hair - Highest density area -->
    <circle cx="225" cy="140" r="4" fill="#00d9ff" opacity="0.9"/>
    <circle cx="215" cy="130" r="3.5" fill="#00d9ff" opacity="0.85"/>
    <circle cx="235" cy="130" r="3.5" fill="#00d9ff" opacity="0.85"/>
    <circle cx="205" cy="140" r="3" fill="#0099cc" opacity="0.7"/>
    <circle cx="245" cy="140" r="3" fill="#0099cc" opacity="0.7"/>
    <circle cx="195" cy="150" r="2.5" fill="#0099cc" opacity="0.6"/>
    <circle cx="255" cy="150" r="2.5" fill="#0099cc" opacity="0.6"/>
    <circle cx="225" cy="125" r="3.2" fill="#00d9ff" opacity="0.8"/>
    <circle cx="210" cy="120" r="2.5" fill="#0099cc" opacity="0.65"/>
    <circle cx="240" cy="120" r="2.5" fill="#0099cc" opacity="0.65"/>
    
    <!-- Forehead -->
    <circle cx="190" cy="155" r="2.8" fill="#00d9ff" opacity="0.75"/>
    <circle cx="225" cy="152" r="3.2" fill="#00d9ff" opacity="0.8"/>
    <circle cx="260" cy="155" r="2.8" fill="#00d9ff" opacity="0.75"/>
    <circle cx="175" cy="160" r="2" fill="#0099cc" opacity="0.55"/>
    <circle cx="275" cy="160" r="2" fill="#0099cc" opacity="0.55"/>
    <circle cx="210" cy="158" r="2.2" fill="#0099cc" opacity="0.6"/>
    <circle cx="240" cy="158" r="2.2" fill="#0099cc" opacity="0.6"/>
    
    <!-- Eyes - Key feature -->
    <!-- Left Eye -->
    <circle cx="180" cy="175" r="4" fill="#00d9ff" opacity="0.9"/>
    <circle cx="177" cy="172" r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="182" cy="177" r="1.2" fill="#0a0e27" opacity="0.8"/>
    <circle cx="175" cy="170" r="1.5" fill="#00d9ff" opacity="0.5"/>
    
    <!-- Right Eye -->
    <circle cx="270" cy="175" r="4" fill="#00d9ff" opacity="0.9"/>
    <circle cx="273" cy="172" r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="268" cy="177" r="1.2" fill="#0a0e27" opacity="0.8"/>
    <circle cx="275" cy="170" r="1.5" fill="#00d9ff" opacity="0.5"/>
    
    <!-- Eye surrounds - Definition -->
    <circle cx="170" cy="175" r="2" fill="#0099cc" opacity="0.5"/>
    <circle cx="190" cy="175" r="2" fill="#0099cc" opacity="0.5"/>
    <circle cx="260" cy="175" r="2" fill="#0099cc" opacity="0.5"/>
    <circle cx="280" cy="175" r="2" fill="#0099cc" opacity="0.5"/>
    
    <!-- Nose bridge -->
    <circle cx="225" cy="180" r="2.2" fill="#0099cc" opacity="0.7"/>
    <circle cx="225" cy="188" r="2" fill="#0099cc" opacity="0.65"/>
    <circle cx="225" cy="196" r="2" fill="#0099cc" opacity="0.6"/>
    
    <!-- Nostrils -->
    <circle cx="220" cy="200" r="1.5" fill="#0099cc" opacity="0.55"/>
    <circle cx="230" cy="200" r="1.5" fill="#0099cc" opacity="0.55"/>
    
    <!-- Cheekbones - Definition -->
    <circle cx="165" cy="185" r="2.8" fill="#00d9ff" opacity="0.65"/>
    <circle cx="285" cy="185" r="2.8" fill="#00d9ff" opacity="0.65"/>
    <circle cx="160" cy="195" r="2.5" fill="#0099cc" opacity="0.55"/>
    <circle cx="290" cy="195" r="2.5" fill="#0099cc" opacity="0.55"/>
    <circle cx="155" cy="205" r="2" fill="#0099cc" opacity="0.45"/>
    <circle cx="295" cy="205" r="2" fill="#0099cc" opacity="0.45"/>
    
    <!-- Mid-face dimension -->
    <circle cx="200" cy="190" r="2" fill="#0099cc" opacity="0.6"/>
    <circle cx="250" cy="190" r="2" fill="#0099cc" opacity="0.6"/>
    
    <!-- Mouth area -->
    <circle cx="200" cy="215" r="2" fill="#00d9ff" opacity="0.55"/>
    <circle cx="225" cy="218" r="2.2" fill="#00d9ff" opacity="0.65"/>
    <circle cx="250" cy="215" r="2" fill="#00d9ff" opacity="0.55"/>
    <circle cx="215" cy="223" r="1.8" fill="#0099cc" opacity="0.5"/>
    <circle cx="235" cy="223" r="1.8" fill="#0099cc" opacity="0.5"/>
    
    <!-- Jawline - Definition -->
    <circle cx="150" cy="210" r="2" fill="#0099cc" opacity="0.5"/>
    <circle cx="300" cy="210" r="2" fill="#0099cc" opacity="0.5"/>
    <circle cx="145" cy="225" r="1.8" fill="#0099cc" opacity="0.45"/>
    <circle cx="305" cy="225" r="1.8" fill="#0099cc" opacity="0.45"/>
    <circle cx="140" cy="240" r="1.5" fill="#0099cc" opacity="0.35"/>
    <circle cx="310" cy="240" r="1.5" fill="#0099cc" opacity="0.35"/>
    
    <!-- Chin definition -->
    <circle cx="225" cy="240" r="2.5" fill="#0099cc" opacity="0.6"/>
    <circle cx="210" cy="245" r="1.8" fill="#0099cc" opacity="0.5"/>
    <circle cx="240" cy="245" r="1.8" fill="#0099cc" opacity="0.5"/>
    
    <!-- Neck -->
    <circle cx="210" cy="255" r="2" fill="#0099cc" opacity="0.5"/>
    <circle cx="225" cy="260" r="2.2" fill="#0099cc" opacity="0.55"/>
    <circle cx="240" cy="255" r="2" fill="#0099cc" opacity="0.5"/>
    <circle cx="195" cy="265" r="1.5" fill="#0099cc" opacity="0.4"/>
    <circle cx="255" cy="265" r="1.5" fill="#0099cc" opacity="0.4"/>
  </g>
  
  <!-- Status Badge -->
  <g opacity="0.85">
    <rect x="110" y="310" width="230" height="50" rx="25" fill="none" stroke="#00d9ff" stroke-width="2"/>
    <text x="225" y="340" font-family="'Courier New', monospace" font-size="14" fill="#00d9ff" text-anchor="middle">🚀 AVAILABLE FOR WORK</text>
  </g>
  
  <!-- Footer Stats Line -->
  <line x1="100" y1="385" x2="350" y2="385" stroke="#00d9ff" stroke-width="1" opacity="0.2"/>
  
  <!-- Tech highlight badges -->
  <text x="225" y="420" font-family="'Courier New', monospace" font-size="12" fill="#0099cc" text-anchor="middle" opacity="0.8">Full Stack • Node.js • React • Python</text>
  
  <!-- Contact line -->
  <line x1="100" y1="440" x2="350" y2="440" stroke="#00d9ff" stroke-width="1" opacity="0.2"/>
  
  <!-- Footer -->
  <text x="225" y="475" font-family="'Courier New', monospace" font-size="11" fill="#0099cc" text-anchor="middle" opacity="0.7">github.com/vignesh06-OG</text>
  <text x="225" y="495" font-family="'Courier New', monospace" font-size="10" fill="#00d9ff" text-anchor="middle" opacity="0.5">Made with ❤️ | Built for builders</text>
  
  <!-- Decorative corner dots -->
  <circle cx="40" cy="30" r="1.5" fill="#00d9ff" opacity="0.3"/>
  <circle cx="410" cy="30" r="1.5" fill="#00d9ff" opacity="0.3"/>
  <circle cx="40" cy="570" r="1.5" fill="#00d9ff" opacity="0.3"/>
  <circle cx="410" cy="570" r="1.5" fill="#00d9ff" opacity="0.3"/>
</svg>