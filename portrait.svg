<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" style="background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%); display: block; margin: 0 auto;">
  <!-- Dot portrait using particle effect -->
  <defs>
    <radialGradient id="dotGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:0.3" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="200" y="40" font-family="Courier New, monospace" font-size="32" font-weight="bold" fill="#00d9ff" text-anchor="middle" letter-spacing="2">VIGNESH</text>
  <text x="200" y="65" font-family="Courier New, monospace" font-size="14" fill="#0099cc" text-anchor="middle" letter-spacing="3" opacity="0.8">DEV ENGINEER</text>
  
  <!-- Decorative line -->
  <line x1="80" y1="75" x2="320" y2="75" stroke="#00d9ff" stroke-width="1" opacity="0.3"/>
  
  <!-- Dot portrait face area - represented with geometric particle composition -->
  <!-- Head outline using dots -->
  <g filter="url(#glow)" opacity="0.95">
    <!-- Crown area -->
    <circle cx="200" cy="140" r="3" fill="#00d9ff" opacity="0.8"/>
    <circle cx="195" cy="135" r="2.5" fill="#00d9ff" opacity="0.7"/>
    <circle cx="205" cy="135" r="2.5" fill="#00d9ff" opacity="0.7"/>
    <circle cx="190" cy="140" r="2" fill="#0099cc" opacity="0.6"/>
    <circle cx="210" cy="140" r="2" fill="#0099cc" opacity="0.6"/>
    
    <!-- Forehead dots -->
    <circle cx="185" cy="150" r="2.8" fill="#00d9ff" opacity="0.75"/>
    <circle cx="200" cy="148" r="3" fill="#00d9ff" opacity="0.8"/>
    <circle cx="215" cy="150" r="2.8" fill="#00d9ff" opacity="0.75"/>
    <circle cx="178" cy="155" r="2" fill="#0099cc" opacity="0.5"/>
    <circle cx="222" cy="155" r="2" fill="#0099cc" opacity="0.5"/>
    
    <!-- Left eye -->
    <circle cx="180" cy="165" r="3.2" fill="#00d9ff" opacity="0.85"/>
    <circle cx="178" cy="164" r="1.5" fill="#ffffff" opacity="0.6"/>
    
    <!-- Right eye -->
    <circle cx="220" cy="165" r="3.2" fill="#00d9ff" opacity="0.85"/>
    <circle cx="222" cy="164" r="1.5" fill="#ffffff" opacity="0.6"/>
    
    <!-- Bridge of nose -->
    <circle cx="200" cy="170" r="2" fill="#0099cc" opacity="0.7"/>
    <circle cx="200" cy="177" r="2" fill="#0099cc" opacity="0.6"/>
    
    <!-- Cheekbones -->
    <circle cx="168" cy="175" r="2.5" fill="#00d9ff" opacity="0.6"/>
    <circle cx="232" cy="175" r="2.5" fill="#00d9ff" opacity="0.6"/>
    <circle cx="165" cy="180" r="2" fill="#0099cc" opacity="0.5"/>
    <circle cx="235" cy="180" r="2" fill="#0099cc" opacity="0.5"/>
    
    <!-- Mouth area -->
    <circle cx="190" cy="195" r="2" fill="#00d9ff" opacity="0.5"/>
    <circle cx="200" cy="197" r="2.2" fill="#00d9ff" opacity="0.6"/>
    <circle cx="210" cy="195" r="2" fill="#00d9ff" opacity="0.5"/>
    
    <!-- Jawline definition -->
    <circle cx="160" cy="185" r="2.2" fill="#0099cc" opacity="0.5"/>
    <circle cx="240" cy="185" r="2.2" fill="#0099cc" opacity="0.5"/>
    <circle cx="155" cy="195" r="1.8" fill="#0099cc" opacity="0.4"/>
    <circle cx="245" cy="195" r="1.8" fill="#0099cc" opacity="0.4"/>
    <circle cx="150" cy="205" r="1.5" fill="#0099cc" opacity="0.3"/>
    <circle cx="250" cy="205" r="1.5" fill="#0099cc" opacity="0.3"/>
    
    <!-- Neck area -->
    <circle cx="190" cy="215" r="2" fill="#0099cc" opacity="0.5"/>
    <circle cx="200" cy="220" r="2" fill="#0099cc" opacity="0.5"/>
    <circle cx="210" cy="215" r="2" fill="#0099cc" opacity="0.5"/>
    <circle cx="185" cy="225" r="1.5" fill="#0099cc" opacity="0.4"/>
    <circle cx="215" cy="225" r="1.5" fill="#0099cc" opacity="0.4"/>
    
    <!-- Hair/top of head volume -->
    <circle cx="175" cy="130" r="2" fill="#0099cc" opacity="0.6"/>
    <circle cx="225" cy="130" r="2" fill="#0099cc" opacity="0.6"/>
    <circle cx="170" cy="125" r="1.8" fill="#0099cc" opacity="0.5"/>
    <circle cx="230" cy="125" r="1.8" fill="#0099cc" opacity="0.5"/>
    <circle cx="200" cy="120" r="2.2" fill="#00d9ff" opacity="0.7"/>
  </g>
  
  <!-- Signature line -->
  <line x1="80" y1="250" x2="320" y2="250" stroke="#00d9ff" stroke-width="1" opacity="0.2"/>
  
  <!-- Status badge -->
  <rect x="120" y="280" width="160" height="40" rx="20" fill="none" stroke="#00d9ff" stroke-width="2" opacity="0.6"/>
  <text x="200" y="308" font-family="Courier New, monospace" font-size="13" fill="#00d9ff" text-anchor="middle">🚀 AVAILABLE FOR WORK</text>
  
  <!-- Footer decoration -->
  <circle cx="100" cy="380" r="2" fill="#00d9ff" opacity="0.4"/>
  <circle cx="200" cy="380" r="2" fill="#00d9ff" opacity="0.4"/>
  <circle cx="300" cy="380" r="2" fill="#00d9ff" opacity="0.4"/>
  
  <text x="200" y="440" font-family="Courier New, monospace" font-size="11" fill="#0099cc" text-anchor="middle" opacity="0.7">github.com/vignesh06-OG</text>
</svg>